# The spiffex issuer for a Kubernetes cluster, trusting the cluster's own
# service account tokens. Before applying, create in the spiffex namespace:
#
#   Secret spiffex-signing-keys   key files made with: spiffex key add -dir <dir>
#   Secret spiffex-issuer-tls     tls.crt and tls.key for spiffex-issuer.spiffex.svc
#
# Adjust trust_domain, the cluster origin's namespaces, and its issuer if your
# cluster's service account issuer differs
# (kubectl get --raw /.well-known/openid-configuration). Pin the image to a
# digest (RELEASING.md shows how to verify it).
apiVersion: v1
kind: Namespace
metadata:
  name: spiffex
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spiffex-issuer
  namespace: spiffex
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spiffex-issuer
  namespace: spiffex
data:
  # The issuer's settings. They change only with a restart.
  issuer.yaml: |
    issuer: https://spiffex-issuer.spiffex.svc
    trust_domain: example.org
    keys_dir: /keys
    state:
      configmap: { namespace: spiffex, name: spiffex-state }
    # Serve the management API at https://spiffex-issuer.spiffex.svc/manage.
    # Nobody can use it until spiffex bootstrap has written a first grant.
    management: true
    # Left out, fetch keeps its defaults: keys are fetched only from public
    # addresses, but for the cluster's own API server on port 443, which the
    # kubernetes provider reads them from.
---
# The issuer's state: who gets which identity. The issuer reads it through
# the Kubernetes API and takes up changes while it runs. Apply it once; after
# that, change it through the management API (spiffex manage) or in place
# (kubectl edit), so that applying these manifests again does not undo the
# changes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: spiffex-state
  namespace: spiffex
data:
  state.yaml: |
    origins:
      # The service accounts of the namespaces listed, with a token bound to a
      # running pod and projected for the audience
      # https://spiffex-issuer.spiffex.svc/origins/cluster. A pod of service
      # account billing in namespace shop is
      # spiffe://example.org/cluster/ns/shop/sa/billing. List only namespaces
      # whose names nobody else can take: whoever creates a namespace of a
      # listed name holds its identities.
      cluster:
        provider: kubernetes
        with:
          # The issuer reads the cluster's keys with its own service account
          # token, which the default system:service-account-issuer-discovery
          # binding allows, if the distribution keeps it.
          issuer: https://kubernetes.default.svc.cluster.local
          namespaces: [shop]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spiffex-issuer
  namespace: spiffex
rules:
  # Reading the state, and nothing else in the cluster. Writing it (update)
  # is needed only for the management API and spiffex bootstrap; drop it
  # when management is off.
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [spiffex-state]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spiffex-issuer
  namespace: spiffex
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spiffex-issuer
subjects:
  - kind: ServiceAccount
    name: spiffex-issuer
    namespace: spiffex
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spiffex-issuer
  namespace: spiffex
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spiffex-issuer
  template:
    metadata:
      labels:
        app: spiffex-issuer
    spec:
      serviceAccountName: spiffex-issuer
      # Preferences only, so that a single-node cluster still schedules both replicas.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: spiffex-issuer
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: spiffex-issuer
      securityContext:
        runAsNonRoot: true
        # The key files below are readable by this group alone (mode 0440),
        # which the issuer's user is in and a verifier_user would not be.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: issuer
          image: ghcr.io/petersr/spiffex:v0.1.0-rc.1
          args:
            - issuer
            - -config=/config/issuer.yaml
            - -listen=:8443
            - -tls-cert=/tls/tls.crt
            - -tls-key=/tls/tls.key
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: keys
              mountPath: /keys
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: spiffex-issuer
        - name: keys
          secret:
            secretName: spiffex-signing-keys
            defaultMode: 0440
        - name: tls
          secret:
            secretName: spiffex-issuer-tls
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: spiffex-issuer
  namespace: spiffex
spec:
  selector:
    app: spiffex-issuer
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: spiffex-issuer
  namespace: spiffex
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: spiffex-issuer
