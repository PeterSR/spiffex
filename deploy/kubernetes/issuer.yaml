# The spiffex issuer for a Kubernetes cluster, trusting the cluster's own
# service account tokens. Before applying, create in the spiffex namespace:
#
#   Secret spiffex-signing-keys   key files made with: spiffex key add -dir <dir>
#   Secret spiffex-issuer-tls     tls.crt and tls.key for spiffex-issuer.spiffex.svc
#
# Adjust trust_domain, and the cluster origin's issuer if your cluster's
# service account issuer differs (kubectl get --raw /.well-known/openid-configuration).
apiVersion: v1
kind: Namespace
metadata:
  name: spiffex
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spiffex-issuer
  namespace: spiffex
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spiffex-issuer
  namespace: spiffex
data:
  # The issuer's settings. They change only with a restart.
  issuer.yaml: |
    issuer: https://spiffex-issuer.spiffex.svc
    trust_domain: example.org
    keys_dir: /keys
    state:
      configmap: { namespace: spiffex, name: spiffex-state }
    # Keys are fetched only from public addresses, but for the cluster's own
    # API server, which the kubernetes provider reads them from.
    fetch:
      refuse_private_addresses: true
      allow_private_hosts: [kubernetes.default.svc.cluster.local]
---
# The issuer's state: who gets which identity. The issuer reads it through
# the Kubernetes API and takes up changes while it runs. Apply it once; after
# that, change it in place (kubectl edit), so that applying these manifests
# again does not undo the changes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: spiffex-state
  namespace: spiffex
data:
  state.yaml: |
    origins:
      # Every service account in the cluster but those of kube-system, with a
      # token bound to a running pod and projected for the audience
      # https://spiffex-issuer.spiffex.svc/origins/cluster. A pod of service
      # account billing in namespace shop is
      # spiffe://example.org/cluster/ns/shop/sa/billing. Narrow it with
      # namespaces: [shop, ...] under with.
      cluster:
        provider: kubernetes
        with:
          # The issuer reads the cluster's keys with its own service account
          # token, which the default system:service-account-issuer-discovery
          # binding allows, if the distribution keeps it.
          issuer: https://kubernetes.default.svc.cluster.local
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spiffex-issuer
  namespace: spiffex
rules:
  # Reading the state, and nothing else in the cluster.
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [spiffex-state]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spiffex-issuer
  namespace: spiffex
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spiffex-issuer
subjects:
  - kind: ServiceAccount
    name: spiffex-issuer
    namespace: spiffex
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spiffex-issuer
  namespace: spiffex
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spiffex-issuer
  template:
    metadata:
      labels:
        app: spiffex-issuer
    spec:
      serviceAccountName: spiffex-issuer
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: issuer
          image: ghcr.io/petersr/spiffex:latest
          args:
            - issuer
            - -config=/config/issuer.yaml
            - -listen=:8443
            - -tls-cert=/tls/tls.crt
            - -tls-key=/tls/tls.key
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: keys
              mountPath: /keys
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: spiffex-issuer
        - name: keys
          secret:
            secretName: spiffex-signing-keys
        - name: tls
          secret:
            secretName: spiffex-issuer-tls
---
apiVersion: v1
kind: Service
metadata:
  name: spiffex-issuer
  namespace: spiffex
spec:
  selector:
    app: spiffex-issuer
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: spiffex-issuer
  namespace: spiffex
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: spiffex-issuer
