{{- /*
The state ConfigMap is created on install and never rendered again once it exists: from then on the
management API, spiffex bootstrap and kubectl edit own it. The keep policy stops Helm from deleting
it on the upgrade that no longer renders it, and on uninstall. Without cluster access (helm template,
Argo CD) lookup finds nothing, so the ConfigMap is always rendered; see README.md.
*/ -}}
{{- if not .Values.state.existingConfigMap }}
{{- $name := include "spiffex.stateConfigMap" . }}
{{- if not (lookup "v1" "ConfigMap" .Release.Namespace $name) }}
{{- $grants := (.Values.state.content | default dict).grants }}
{{- if kindIs "map" $grants }}
{{- range $grant, $g := $grants }}
{{- if and (kindIs "map" $g) (hasKey $g "true") }}
{{- fail (printf "state.content.grants.%s: write the on key as \"on\" (quoted); Helm reads values as YAML 1.1, where a bare on is the boolean true" $grant) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spiffex.labels" . | nindent 4 }}
  annotations:
    {{- $annotations := deepCopy (.Values.state.configMapAnnotations | default dict) }}
    {{- $syncOptions := list }}
    {{- range splitList "," (get $annotations "argocd.argoproj.io/sync-options") }}
    {{- if trim . }}{{ $syncOptions = append $syncOptions (trim .) }}{{ end }}
    {{- end }}
    {{- $syncOptions = concat $syncOptions (list "Prune=false" "Delete=false") | uniq }}
    {{- $_ := set $annotations "argocd.argoproj.io/sync-options" (join "," $syncOptions) }}
    {{- $_ = set $annotations "helm.sh/resource-policy" "keep" }}
    {{- toYaml $annotations | nindent 4 }}
data:
  state.yaml: |
    {{- if .Values.state.content }}
    {{- toYaml .Values.state.content | nindent 4 }}
    {{- else }}
    {}
    {{- end }}
{{- end }}
{{- end }}
