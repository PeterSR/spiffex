apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "spiffex.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spiffex.labels" . | nindent 4 }}
data:
  # The issuer's settings. They change only with a restart, which a change here triggers.
  issuer.yaml: |
    {{- include "spiffex.settings" . | nindent 4 }}
