# Publishes a release when a v* tag is pushed; RELEASING.md describes the process. In order:
#
#   test     the checks of test.yml, run again on the tagged commit
#   release  binaries, archives, checksums and SBOMs on a draft GitHub release, and the image
#            ghcr.io/petersr/spiffex, all built by goreleaser; the checksums and the image signed
#            with cosign and their build provenance attested
#   chart    the Helm chart, pushed to oci://ghcr.io/petersr/charts once the image it refers to
#            exists, signed and attested
#   publish  the draft release made public, and the image tags X.Y and latest moved to the new
#            image, unless it is a prerelease
#
# A tag with a suffix, such as v0.1.0-rc.1, is a prerelease: the image gets only its vX.Y.Z-rc.N
# tag, and neither latest nor X.Y moves. The release job is the one approval point (environment
# release); the jobs after it run only once it has succeeded, and nothing publishes before it.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# GHCR names must be lowercase, so they are written out rather than derived from the repository.
env:
  IMAGE: ghcr.io/petersr/spiffex
  CHART: ghcr.io/petersr/charts/spiffex

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  release:
    needs: [test]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # the draft release and its assets
      packages: write # the image
      id-token: write # keyless signing and attestations
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        name: version from the tag
        run: |
          # Semantic Versioning 2.0.0, with an optional prerelease and no build metadata.
          id='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq "^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-$id(\.$id)*)?\$"; then
            echo "::error::$GITHUB_REF_NAME is not a version tag such as v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          version=${GITHUB_REF_NAME#v}
          case $version in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          {
            echo "version=$version"
            echo "minor=$(printf '%s' "$version" | cut -d. -f1-2)"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      - name: release notes from CHANGELOG.md
        run: scripts/changelog-section.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # A fixed Go, so a release can be rebuilt bit for bit. Raise it with each Go patch release.
          go-version: "1.26.9"
          # A release is built from a clean module and build cache.
          cache: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Keyless signatures and attestations go to public transparency logs, which would name a
      # private repository, its workflow and commit; attestations also need a public repository.
      # So a private repository releases unsigned.
      - name: no signatures or attestations from a private repository
        if: github.event.repository.private
        run: echo "::warning::the repository is private, so this release is not signed and has no build provenance attestations"
      - if: github.event.repository.private == false
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.52.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: release --clean --release-notes ${{ runner.temp }}/notes.md ${{ github.event.repository.private && '--skip=sign' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: image digest
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME" --format '{{json .Manifest}}' | jq -r .digest)
          case $digest in
            sha256:*) echo "digest=$digest" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::no digest for $IMAGE:$GITHUB_REF_NAME"; exit 1 ;;
          esac
      - name: sign the image
        if: github.event.repository.private == false
        run: cosign sign --yes "$IMAGE@$DIGEST"
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
      - name: attest the archives
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: attest the image
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  chart:
    # The chart refers to the image, so it is published only once the image exists.
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0
      - name: no signature or attestation from a private repository
        if: github.event.repository.private
        run: echo "::warning::the repository is private, so the chart is not signed and has no build provenance attestation"
      - if: github.event.repository.private == false
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: package
        name: package and push the chart
        run: |
          sed -i "s/^  artifacthub.io\/prerelease: .*/  artifacthub.io\/prerelease: \"$PRERELEASE\"/" charts/spiffex/Chart.yaml
          helm package charts/spiffex --version "$VERSION" --app-version "$VERSION" --destination "$RUNNER_TEMP"
          printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "$RUNNER_TEMP/spiffex-$VERSION.tgz" oci://ghcr.io/petersr/charts 2>&1 | tee "$RUNNER_TEMP/push.log"
          digest=$(sed -n 's/^Digest: \(sha256:[0-9a-f]*\)$/\1/p' "$RUNNER_TEMP/push.log")
          if [ -z "$digest" ]; then
            echo "::error::helm push printed no digest"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ needs.release.outputs.version }}
          PRERELEASE: ${{ needs.release.outputs.prerelease }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: sign the chart
        if: github.event.repository.private == false
        run: cosign sign --yes "$CHART@$DIGEST"
        env:
          DIGEST: ${{ steps.package.outputs.digest }}
      - name: attest the chart
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.CHART }}
          subject-digest: ${{ steps.package.outputs.digest }}
          push-to-registry: true

  publish:
    needs: [release, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the release
      packages: write # move the image tags
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: needs.release.outputs.prerelease == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: move the X.Y and latest image tags
        if: needs.release.outputs.prerelease == 'false'
        run: docker buildx imagetools create --tag "$IMAGE:$MINOR" --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
        env:
          MINOR: ${{ needs.release.outputs.minor }}
          DIGEST: ${{ needs.release.outputs.digest }}
      - name: publish the draft release
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease="$PRERELEASE" --latest="$LATEST"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.release.outputs.prerelease }}
          LATEST: ${{ needs.release.outputs.prerelease == 'false' }}
