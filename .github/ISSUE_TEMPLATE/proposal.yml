name: Proposal
description: A new feature, or a change to the specification.
labels: [proposal]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do that spiffex makes hard or impossible today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The proposal
      description: What you would change. If it touches SPEC.md, say which sections.
    validations:
      required: true
