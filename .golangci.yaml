version: "2"
linters:
  default: standard
  settings:
    staticcheck:
      # golangci-lint's default set, without the quickfix suggestions, which are style.
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF*"]
  exclusions:
    # Unchecked errors from Close, Remove, Fprintf and the like.
    presets:
      - std-error-handling
