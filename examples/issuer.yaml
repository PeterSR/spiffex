# Settings for an issuer that runs in the Kubernetes cluster "prod" and serves the state in
# state.yaml, next to this file. Only the operator changes these settings; the issuer reads them
# at startup. See docs/configuration.md for every field.
#
# Check this file and the state together with:
#   spiffex check -settings examples/issuer.yaml examples/state.yaml

issuer: https://spiffex.example.org     # what workloads and verifiers reach; tokens carry it as iss
trust_domain: example.org
keys_dir: /keys                         # the signing keys, mounted from a Secret
token_ttl: 5m
activation_delay: 30m

# The state lives in a ConfigMap, read and written through the Kubernetes API. For an issuer
# outside a cluster, use "file: state.yaml" or "dir: state" instead.
state:
  configmap: { namespace: spiffex, name: spiffex-state }

# Serve the management API at https://spiffex.example.org/manage, for the grants in the state.
management: true

# readable_files, bearer_token_files and fetch are left out, so they keep their defaults: exactly
# what the shipped kubernetes provider needs to read the cluster's keys, and key fetches only from
# public addresses, but for the cluster's own API server at kubernetes.default.svc.cluster.local:443.

# The ingress in front of the issuer, whose X-Forwarded-For header names the client, so that the
# per-client limits apply to clients rather than to the ingress.
trusted_proxies: [10.42.0.0/16]
